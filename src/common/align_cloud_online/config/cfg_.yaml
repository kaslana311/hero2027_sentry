# align_cloud_online.yaml
align_cloud_online:
  ros__parameters:
    init_pose: [0.434 ,0.0,0.0 ,1.22172,0.0,3.14159] #xyzrpy

    # 点云话题
    lidar1_topic: "/livox/lidar1/pointcloud"
    lidar2_topic: "/livox/lidar2/pointcloud"
    output_topic: "/livox/aligned/pointcloud"

    # 以下参数在 USE_NDT 未定义时生效（small_gicp）
    smgicp_global_leaf_size: 0.05
    smgicp_local_leaf_size: 0.05
    smgicp_max_iterations: 500
    smgicp_num_threads: 4
    smgicp_max_dist_sq: 4.0
    neighbor_num: 20

    # 以下参数在 USE_NDT 定义时生效（NDT）
    ndt_epsilon_: 0.01
    ndt_step_size_: 0.1
    ndt_resolution_: 1.0
    ndt_iterations_: 400
name: nav_vision_bridge

topics:
  carrot_pose_forwarding:
    topic: /carrot_pose
    type: geometry_msgs/msg/PoseStamped
    from_domain: 1
    to_domain: 2
  
  tracker/out:
    type: interfaces/msg/TrackerOutput
    from_domain: 2
    to_domain: 1
    qos:
      reliability: best_effort
      durability: volatile
      depth: 1
      history: keep_last
rog_map:
  # 分辨率
  resolution: 0.05
  # 膨胀分辨率
  inflation_resolution: 0.1
  # 膨胀步数
  inflation_step: 2
  # 是否启用未知区域膨胀
  unk_inflation_en: false
  # 未知区域膨胀步数
  unk_inflation_step: 1
  # 地图尺寸 [长, 宽, 高] (单位：米)
  map_size: [ 15,15,2 ] #
  # 如果禁用地图滚动，则应设置地图原点 [x, y, z] (单位：米)。
  fix_map_origin: [ -4.0,-9.9,0.25 ] # 相对于odom的移动
  # 是否启用边界提取
  frontier_extraction_en: false

  # 虚拟天花板和地面高度
  virtual_ceil_height: 2.2
  virtual_ground_height: -0.2

  # 是否从PCD文件加载地图
  load_pcd_en: false

  # 地图滑动窗口
  map_sliding:
    # 是否启用滑动窗口
    enable: true
    # 滑动地图的最小距离 [米]。
    threshold: 0.3

  # ESDF（欧几里得符号距离场）配置
  esdf:
    # 是否启用ESDF
    enable: false
    # ESDF分辨率
    resolution: 0.1
    # ESDF在里程计周围的局部更新范围 [长, 宽, 高] (单位：米)。
    local_update_box: [ 10,10,6 ]

  # ROS回调配置
  # 如果 [enable = true]，ROG-Map 将主动接收ROS话题作为输入。
  # 否则，用户应调用函数 [updateMap] 来手动更新地图。
  ros_callback:
    enable: true
    # 点云话题名称
    cloud_topic: "registered_scan"
    # 里程计话题名称
    odom_topic: "lidar_odometry"
    # 里程计超时时间 (秒)
    odom_timeout: 2.0

  # 可视化配置
  visualization:
    # 是否启用可视化
    enable: true
    # 启用时，使用 rqt_reconfigure 动态调整可视化参数。
    use_dynamic_reconfigure: false
    # 可视化的时间触发频率 [Hz]，如果设置为0，则不会按时间触发可视化。
    time_rate: 2
    # 可视化的帧触发频率 [Hz]，如果设置为0，则不会按帧触发可视化。
    frame_rate: 0
    # 以里程计为中心的可视化范围 [长, 宽, 高] (单位：米)。
    range: [ 10,10,2 ]
    # 可视化发布的坐标系ID
    frame_id: "odom"
    # 是否发布未知区域地图
    pub_unknown_map_en: false

  # 输入点云的强度过滤阈值。如果点强度小于此值，该点将被忽略（以避免像灰尘这样的噪声）。
  intensity_thresh: -10
  # 输入点云的时间下采样率。例如，如果设置为k，点云将被下采样到1/k。
  point_filt_num: 1

  # 概率更新（光线投射法）配置
  raycasting:
    # 如果禁用，地图将仅维护占用信息，所有其他网格将被视为未知。
    enable: true
    # 批量更新大小
    batch_update_size: 1
    # 局部更新范围 [长, 宽, 高] (单位：米)。
    local_update_box: [ 10,10,2 ]
    # 光线投射的范围 [最小距离, 最大距离] (单位：米)。
    ray_range: [0.5, 100 ]

    # 概率参数
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # 非占用信息地图网格被视为空闲状态的阈值。[0.0-1.0]
    # 对于计数器地图，如果每个单元格在概率地图中包含N个单元格，则仅当
    # N_unk > N * unk_thresh 个单元格为未知时，该单元格才被视为未知。
    # 示例：1) 如果 unk_thresh 设置为 0.0，则一旦概率地图中至少有一个单元格为未知，该单元格就被视为未知。
    #       2) 如果 unk_thresh 设置为 1.0，则仅当概率地图中所有单元格都为未知时，该单元格才被视为未知。
    # 总之，1.0 更激进，而 0.0 更保守。
    unk_thresh: 1.0
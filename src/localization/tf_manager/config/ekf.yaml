ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    two_d_mode: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 激光雷达里程计（提供位置和yaw）
    odom0: /aft_mapped_to_init
    odom0_config: [true,  true,  true,
                   true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    odom0: /wheel_odom_velocity

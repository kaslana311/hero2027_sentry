ekf_filter_node:
  ros__parameters:
    frequency: 150.0
    two_d_mode: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 激光雷达里程计（提供位置和yaw）
    odom0: /aft_mapped_to_init
    odom0_config: [true,  true,  true,     # X, Y, Z
                   false, false, true,     # Roll, Pitch, Yaw
                   false, false, false,    # Vx, Vy, Vz
                   false, false, false,    # Vroll, Vpitch, Vyaw
                   false, false, false]    # Ax, Ay, Az
    odom0_differential: false

    # 轮式里程计速度（提供线速度）
    twist0: /wheel_odom_velocity
    twist0_config: [false, false, false,   # X, Y, Z (不使用)
                    false, false, false,   # Roll, Pitch, Yaw (不使用)
                    true,  true,  false,   # Vx, Vy, Vz (使用x和y方向速度)
                    false, false, false,   # Vroll, Vpitch, Vyaw (不使用)
                    false, false, false]   # Ax, Ay, Az (不使用)
    twist0_differential: false
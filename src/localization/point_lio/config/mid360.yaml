/**:
    ros__parameters:
        use_imu_as_input: false                      # Change to True to use IMU as input of Point-LIO
        prop_at_freq_of_imu: True
        check_satu: True
        init_map_size: 1000
        point_filter_num: 4                                 # Options: 4, 3
        space_down_sample: false                             # Options: true, false
        filter_size_surf: 0.1                               # 决定体素滤波参数 Options: 0.5, 0.3, 0.2, 0.15, 0.1
        filter_size_map: 0.3                                # Options: 0.5, 0.3, 0.15, 0.1
        ivox_nearby_type: 18                                 # Options: 0, 6, 18, 26
        runtime_pos_log_enable: False                       # Option: True
        global_map_pub_en: True                             # 是否发布彩色全局地图
        global_map_pub_skip: 5                              # 全局地图发布间隔（每隔N次迭代发布一次）

        common:
            lid_topic: "livox/lidar"
            imu_topic: "livox/imu"
            con_frame: False                                # True: if you need to combine several LiDAR frames into one
            con_frame_num: 1                                # the number of frames combined
            cut_frame: False                                # True: if you need to cut one LiDAR frame into several subframes
            cut_frame_time_interval: 0.1                    # should be integral fraction of 1 / LiDAR frequency
            time_diff_lidar_to_imu: 0.0                     # Time offset between LiDAR and IMU calibrated by other algorithms, e.g., LI-Init (find in Readme)

        prior_pcd:
            enable: False
            prior_pcd_map_path: "src/common/point_cloud_files/filtered_pcd/fast_lio_latest_map.pcd"
            init_pose: [ 0.0, 0.0, 0.0 ]

        preprocess:
            lidar_type: 1                                  # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR
            scan_line: 4
            timestamp_unit: 3                             # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 0.3                                    # 盲区过滤，忽略距离小于0.5米的点云（减少自遮挡噪声）

        mapping:
            imu_en: true
            extrinsic_est_en: False                         # for aggressive motion, set this variable False
            imu_time_inte: 0.005                            # = 1 / frequency of IMU
            lidar_time_inte: 0.05
            satu_acc: 5.0                                   # the saturation value  of IMU's acceleration. not related to the units
            satu_gyro: 35.0                                 # the saturation value of IMU's angular velocity. not related to the units
            acc_norm: 1.0                                   # 1.0 for g as unit, 9.81 for m/s^2 as unit of the IMU's acceleration
            lidar_meas_cov: 0.005                            # 0.001 LiDAR测量噪声（值越小，信任度越高）
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.001
            b_gyr_cov: 0.001
            imu_meas_acc_cov: 0.05                         # 0.1 # 2 IMU零偏随机游走噪声
            imu_meas_omg_cov: 0.01                          # 0.1 # 2
            gyr_cov_input: 0.01                             # for IMU as input model
            acc_cov_input: 0.1                              # for IMU as input model
            plane_thr: 0.1                                  # 0.05, the threshold for plane criteria, the smaller, the flatter a plane
            match_s: 81.0
            ivox_grid_resolution: 0.5       #2.0
            gravity: [ 0.0, 0.0, -9.810 ]
            gravity_init: [ 0.0, 0.0, -9.810 ]              # [0.0, 9.810, 0.0] # # preknown gravity in the first IMU body frame, use when imu_en is False or start from a non-stationary state
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [0.9396926, 0.0,    -0.3420201,
                          0.0,       1.0,     0.0,
                          0.3420201, 0.0,     0.9396926]
        odometry:
            publish_odometry_without_downsample: False

        publish:
            path_en: True                                   # False: close the path output
            scan_publish_en: True                           # False: close all the point cloud output
            scan_bodyframe_pub_en: True                    # True: output the point cloud scans in IMU-body-frame
            tf_send_en: True                                # True: send transform from 'odom' to 'lidar_frame'

        pcd_save:
            pcd_save_en: true                              
            interval: -1                                    # how many LiDAR frames saved in each pcd file;
                                                            # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
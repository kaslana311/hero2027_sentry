hero_lidar_scan_node:
  ros__parameters:
    # 话题配置
    lidar1_topic: "/livox/lidar1"
    lidar2_topic: "/livox/lidar2"
    odom_topic: "/odom"
    fused_cloud_topic: "/fused_cloud"

    # 雷达1外参 (相对于base_link)
    lidar1_x: 0.0
    lidar1_y: 0.15
    lidar1_z: 0.2
    lidar1_roll: 0.0
    lidar1_pitch: 0.0
    lidar1_yaw: 0.0

    # 雷达2外参 (相对于base_link)
    lidar2_x: 0.0
    lidar2_y: -0.15
    lidar2_z: 0.2
    lidar2_roll: 0.0
    lidar2_pitch: 0.0
    lidar2_yaw: 3.14159
